name: Build VSB Spanish Resource Pack

on:
  push:
    branches:
      - main
    paths:
      - 'source/VSB_Espanol_1.8.1.zip.b64.part*'
      - '.github/workflows/build-resourcepack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild ZIP
        shell: bash
        run: |
          cat source/VSB_Espanol_1.8.1.zip.b64.part0 \
              source/VSB_Espanol_1.8.1.zip.b64.part1 \
              source/VSB_Espanol_1.8.1.zip.b64.part2 \
              source/VSB_Espanol_1.8.1.zip.b64.part3 \
              > VSB_Espanol_1.8.1.zip.b64
          base64 --decode VSB_Espanol_1.8.1.zip.b64 > VSB_Espanol_1.8.1.zip
          rm VSB_Espanol_1.8.1.zip.b64

      - name: Verify SHA-1
        shell: bash
        run: |
          EXPECTED="42bd08912b48c8be436cc049491f09784ee66987"
          ACTUAL="$(sha1sum VSB_Espanol_1.8.1.zip | awk '{print $1}')"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit built resource pack
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VSB_Espanol_1.8.1.zip
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build VSB Spanish resource pack"
            git push
          fi
